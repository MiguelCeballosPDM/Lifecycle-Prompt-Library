    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Sparkles, Calendar, Lightbulb, Target, BarChart3, Search, Filter, X, Copy, Check, Terminal, BookOpen, Briefcase, CheckSquare, Settings, Database } from 'lucide-react';

        const APP_TITLE = "Lifecycle Team Prompt Library";
        const APP_SUBTITLE = "The ultimate guide to maximizing outputs when interacting with AI.";

        const Category = {
            REPORTS: 'Reports & Metrics',
            CONTENT: 'Content & Calendars',
            INSIGHTS: 'Insights & Analysis',
            STRATEGY: 'Strategy & Planning',
            NEW_BUSINESS: 'New Business & Appraisals',
            PRODUCTION_QA: 'Production & QA',
            OPS: 'Ops & Enablement'
        };

        const PROMPTS = [
          // ── CONTENT & CALENDARS ──
          {
            id: 'c1',
            title: 'Seasonal Intelligence',
            requiresData: true,
            content: `I'm planning campaigns for [TARGET MONTHS] and want this strategy grounded in real performance. Analyze top-performing campaigns from the same months last year, plus the most recent [TIMEFRAME, e.g. 60 days]. Evaluate content themes, creative angles, product focus, and segment targeting. Based on those patterns, propose [# OF CAMPAIGNS] campaign concepts designed to improve CTR, CVR, and AOV, with the rationale behind each.`,
            category: Category.CONTENT,
          },
          {
            id: 'c2',
            title: 'Performance-Informed Calendar',
            requiresData: true,
            content: `Build an intentional campaign calendar for [TARGET MONTH, YEAR] using insights from the last [TIMEFRAME, e.g. 90 days] of performance. Review engagement trends, revenue per recipient, promotional density, and segment rotation. Identify patterns in cadence and fatigue, then design [# OF CAMPAIGNS] email campaign concepts that are strategically spaced and balanced. For each, explain why it should exist this month and what KPI it targets.`,
            category: Category.CONTENT,
          },
          {
            id: 'c3',
            title: 'Re-Engagement Campaign Builder',
            requiresData: true,
            content: `Review our lapsed and at-risk segments and analyze their last [TIMEFRAME, e.g. 6 months] of interaction history — last open, last click, last purchase, and average previous order value. Based on these signals, design [# OF CAMPAIGNS] re-engagement campaign concepts with tailored angles for different levels of disengagement. For each, specify the target window of inactivity, the recommended hook, and the expected reactivation lever.`,
            category: Category.CONTENT,
          },
          {
            id: 'c4',
            title: 'VIP & High-CLV Content Plan',
            requiresData: true,
            content: `Analyze the behavior and preferences of our top [PERCENTAGE, e.g. 10%] customers by CLV over the last [TIMEFRAME, e.g. 6 months]. Identify what content themes, product categories, and offer types resonate most with this group. Design [# OF CAMPAIGNS] campaign concepts exclusively for this tier that reinforce loyalty, increase AOV, and feel differentiated from our general sends.`,
            category: Category.CONTENT,
          },
          {
            id: 'c5',
            title: 'A/B Test Roadmap Generator',
            requiresData: true,
            content: `Review our campaign performance from the last [TIMEFRAME, e.g. 90 days] and identify the [# OF AREAS, e.g. 5] highest-impact areas where testing could improve results — such as subject lines, send times, offer framing, CTA placement, or content structure. For each, propose a specific A/B test with a clear hypothesis, recommended variants, target segment, and the KPI it should be measured against.`,
            category: Category.CONTENT,
          },
          {
            id: 'c6',
            title: 'Flow Content Refresh Planner',
            requiresData: true,
            content: `Audit the current performance of our active email flows — [FLOW NAMES, e.g. welcome series, abandoned cart, post-purchase, winback, browse abandonment]. For each flow, evaluate revenue per recipient and conversion rate as primary metrics, with click rate as a secondary signal. Compare against our campaign benchmarks. Identify which flows are underperforming and propose specific content refresh ideas: new angles, updated copy direction, product spotlight changes, or structural adjustments to timing and number of emails.`,
            category: Category.CONTENT,
          },
          {
            id: 'c7',
            title: 'Holiday & Event Campaign Planner',
            requiresData: true,
            content: `I'm planning campaigns around [HOLIDAY/EVENT, e.g. Mother's Day, Black Friday, Back to School]. Analyze how we performed during this event last year and review what competitors in [INDUSTRY/NICHE] typically do during this period. Design [# OF CAMPAIGNS] campaign concepts for a full event arc — pre-event hype, main event, and post-event follow-up — with specific angles, timing, and segment recommendations for each.`,
            category: Category.CONTENT,
          },
          {
            id: 'c8',
            title: 'Email Copy Intro',
            content: `I need to write [# OF EMAILS, e.g. 1–3] email(s) for [CAMPAIGN TYPE, e.g. product launch, promotional, educational, re-engagement]. The target segment is [SEGMENT, e.g. engaged buyers, VIPs, lapsed customers]. The goal of this send is to [OBJECTIVE, e.g. drive conversions on a specific product, increase AOV, reactivate dormant subscribers]. Review recent campaign performance to understand what content angles, tones, and structures have worked best with this audience. Then write the full email(s) including: subject line, preview text, headline, body copy, and CTA. Keep the tone [TONE, e.g. conversational, premium, urgent, playful] and aligned with how this segment has historically responded.`,
            category: Category.CONTENT,
          },
          {
            id: 'c9',
            title: 'Subject Line Generator',
            content: `Write [# OF OPTIONS, e.g. 10] subject line options for an email about [TOPIC/OFFER]. The target audience is [SEGMENT]. The tone should be [TONE, e.g. playful, urgent, curiosity-driven, premium]. Include preview text for each. Flag which ones lean toward click intent and which lean toward curiosity or intrigue.`,
            category: Category.CONTENT,
          },
          {
            id: 'c10',
            title: 'CTA & Offer Framing Variants',
            content: `I'm promoting [OFFER/PRODUCT] in an upcoming email to [SEGMENT]. Give me [# OF VARIANTS, e.g. 5–8] different ways to frame the offer and CTA — from direct and urgency-driven to softer and value-led. For each, write the CTA button text and one supporting line of copy that would sit above it.`,
            category: Category.CONTENT,
          },
          {
            id: 'c11',
            title: 'Email Brief Creator',
            content: `I need to create a creative brief for an upcoming email campaign about [TOPIC/OFFER] targeting [SEGMENT] on [SEND DATE]. Generate a complete brief that includes: campaign objective, key message, subject line direction, content structure, CTA, and any product or visual recommendations. Keep it concise enough to hand off to a designer or copywriter.`,
            category: Category.CONTENT,
          },
          {
            id: 'c12',
            title: 'Quick Campaign Idea Brainstorm',
            content: `I need a fast campaign idea for [TARGET WEEK/DATE]. The audience is [SEGMENT] and we recently [CONTEXT, e.g. launched a new product, ran a big sale, haven't sent in a week]. Give me [# OF IDEAS, e.g. 3–5] quick campaign concepts with a one-sentence description, suggested subject line, and primary CTA for each.`,
            category: Category.CONTENT,
          },
          {
            id: 'c13',
            title: 'Email Rewrite & Optimizer',
            content: `Here's an email draft I wrote for [CAMPAIGN/PURPOSE]. Review it and give me an improved version with: a stronger subject line, tighter copy, clearer CTA, and better flow. Keep the same core message and tone but make it more effective. Explain briefly what you changed and why.`,
            category: Category.CONTENT,
          },
          {
            id: 'c14',
            title: 'SMS Copy Companion',
            content: `I'm sending an email campaign about [TOPIC/OFFER] to [SEGMENT]. Write [# OF OPTIONS, e.g. 3–5] SMS messages that could complement this email — either as a pre-send teaser, a same-day reminder, or a follow-up for non-openers. For each message: keep it under 160 characters including opt-out language (e.g. "Reply STOP to opt out"), confirm the segment has explicit SMS consent, and note that sends must respect TCPA quiet hours (no sends before 8am or after 9pm in the recipient's time zone). Make the CTA clear.`,
            category: Category.CONTENT,
          },
          {
            id: 'c15',
            title: 'Segmented Angle Variations',
            content: `I have one campaign concept: [CAMPAIGN CONCEPT/OFFER]. I need to send it to [# OF SEGMENTS, e.g. 3] different segments: [SEGMENT LIST, e.g. VIPs, new subscribers, lapsed buyers]. Write a tailored version of the subject line, headline, and main body angle for each segment so the message resonates differently based on where they are in the lifecycle.`,
            category: Category.CONTENT,
          },
          {
            id: 'c16',
            title: 'Content Repurpose Helper',
            content: `I'm going to share [CONTENT TYPE, e.g. a blog post, a social media caption, a landing page, a product description]. Repurpose this content into a complete email including: subject line, preview text, headline, body copy, and CTA. The email should target [SEGMENT] and the goal is [OBJECTIVE, e.g. drive traffic, generate sales, educate]. Adapt the tone and length for email format.`,
            category: Category.CONTENT,
          },

          // ── INSIGHTS & ANALYSIS ──
          {
            id: 'i1',
            title: 'Engagement Decline Investigation',
            requiresData: true,
            content: `Review campaign performance trends over the last [TIMEFRAME, e.g. 120 days] and identify any structural declines in revenue per email, conversion rate, or click behavior. Use these as the primary lens for diagnosis. Note open rate trends as a secondary signal only — Apple Mail Privacy Protection inflates opens by roughly 30%, so open rate alone cannot support a conclusion. Determine whether these shifts suggest audience fatigue, increased promotional density, or changes in segment behavior. Provide hypotheses grounded in revenue and conversion signals and recommend strategic adjustments.`,
            category: Category.INSIGHTS,
          },
          {
            id: 'i2',
            title: 'Conversion Gap Analysis',
            requiresData: true,
            content: `Identify campaigns from the last [TIMEFRAME, e.g. 90 days] with strong click-through rates but weak conversion or revenue per recipient. Analyze potential friction points: audience intent, product alignment, offer structure, or timing. Pinpoint where we're generating interest but failing to capture value, and recommend [# OF TESTS, e.g. 3–5] optimization tests to close that gap.`,
            category: Category.INSIGHTS,
          },
          {
            id: 'i3',
            title: 'Content Theme Evolution',
            requiresData: true,
            content: `Analyze campaign performance over the last [TIMEFRAME, e.g. 6 months] grouped by content theme: promotional, educational, product launch, brand storytelling, and any others identified. Identify which themes consistently drive higher engagement, stronger conversion, and better revenue efficiency. Show whether each theme is gaining or losing effectiveness over time and recommend the ideal content mix for [TARGET MONTH or QUARTER].`,
            category: Category.INSIGHTS,
          },
          {
            id: 'i4',
            title: 'Campaign Type Benchmark',
            requiresData: true,
            content: `Group all email campaigns from the last [TIMEFRAME, e.g. 90 days] by type: promotional, educational, product launch, brand storytelling. Compare click-to-open rate, revenue per recipient, and conversion rate across types. Identify which campaign structures are most efficient and which consistently underperform, so we can refine our content mix.`,
            category: Category.INSIGHTS,
          },
          {
            id: 'i5',
            title: 'Product Opportunity Planning',
            requiresData: true,
            content: `Analyze the last [TIMEFRAME, e.g. 90 days] of campaign data with a focus on product behavior: top-clicked products, top-purchased items, and high AOV drivers. Identify gaps where engagement is strong but conversion is weak. Propose [# OF CAMPAIGNS] campaign ideas that strategically spotlight specific products or bundles, explaining the revenue hypothesis behind each.`,
            category: Category.INSIGHTS,
          },
          {
            id: 'i6',
            title: 'Unsubscribe & Churn Pattern Analysis',
            requiresData: true,
            content: `Analyze unsubscribe and list churn data from the last [TIMEFRAME, e.g. 90 days]. Identify which campaigns, content themes, segments, send frequencies, and offer types correlate with the highest unsubscribe rates. Determine whether churn is concentrated in specific audience tiers or spread evenly. Provide actionable hypotheses on what's driving opt-outs and recommend [# OF ADJUSTMENTS, e.g. 3–5] changes to reduce churn without sacrificing revenue.`,
            category: Category.INSIGHTS,
          },
          {
            id: 'i7',
            title: 'Flows vs. Campaigns Efficiency Comparison',
            requiresData: true,
            content: `Compare the performance efficiency of our automated flows against our manual campaigns over the last [TIMEFRAME, e.g. 90 days]. Evaluate revenue per recipient, conversion rate, and engagement metrics side by side. Identify whether we're over-relying on one channel at the expense of the other, and highlight specific areas where shifting effort or budget between flows and campaigns could improve overall email program performance.`,
            category: Category.INSIGHTS,
          },
          {
            id: 'i8',
            title: 'Cohort Behavior Analysis',
            requiresData: true,
            content: `Segment customers acquired in [COHORT PERIOD, e.g. Q4 2025] and track their email engagement and purchasing behavior over the following [TIMEFRAME, e.g. 90 days]. Compare this cohort's click rate, conversion rate, repeat purchase rate, and AOV against [COMPARISON COHORT, e.g. Q3 2025 customers]. Identify whether acquisition quality is improving or declining and what that implies for retention strategy.`,
            category: Category.INSIGHTS,
          },
          {
            id: 'i9',
            title: 'Why Did This Campaign Work?',
            requiresData: true,
            content: `Campaign [CAMPAIGN NAME] outperformed our averages. Give me a quick breakdown of why — was it the segment, the timing, the subject line, the offer, or the content angle? Compare it against the [# OF CAMPAIGNS, e.g. 5] most similar recent campaigns and tell me what this one did differently.`,
            category: Category.INSIGHTS,
          },
          {
            id: 'i10',
            title: 'Segment Quick Comparison',
            requiresData: true,
            content: `Compare the performance of [SEGMENT A] vs. [SEGMENT B] over the last [TIMEFRAME, e.g. 30 days]. Show click rate, conversion rate, and revenue per recipient side by side. Tell me which segment is more efficient right now and whether the gap is widening or closing.`,
            category: Category.INSIGHTS,
          },
          {
            id: 'i11',
            title: 'Top Products This Month',
            requiresData: true,
            content: `Identify the top [# OF PRODUCTS, e.g. 10] products by email-attributed revenue in the last [TIMEFRAME, e.g. 30 days]. For each, show total revenue, number of purchases, and which campaigns or flows drove the most sales. Flag any products trending up that we haven't featured in a dedicated campaign yet.`,
            category: Category.INSIGHTS,
          },
          {
            id: 'i12',
            title: 'Before vs. After Comparison',
            requiresData: true,
            content: `We made a change to [CHANGE, e.g. send frequency, a specific flow, segment targeting, offer strategy] around [DATE]. Compare key performance metrics from the [TIMEFRAME, e.g. 30 days] before vs. after that change. Tell me if there's a meaningful difference and whether it's likely caused by the change or just normal variance.`,
            category: Category.INSIGHTS,
          },
          {
            id: 'i13',
            title: 'Subject Line Performance Patterns',
            requiresData: true,
            content: `Analyze subject lines from the last [TIMEFRAME, e.g. 60 days] of campaigns. Group them by style — emoji vs. no emoji, question vs. statement, urgency-driven vs. curiosity-driven, short vs. long. Identify which patterns correlate with higher click rates and stronger revenue per recipient. Open rate is unreliable due to Apple Mail Privacy Protection, so do not use it as a primary indicator. Give me [# OF RULES, e.g. 3–5] actionable subject line rules based on our own data.`,
            category: Category.INSIGHTS,
          },
          {
            id: 'i14',
            title: 'Day-of-Week Engagement Patterns',
            requiresData: true,
            content: `Break down campaign engagement by day of the week over the last [TIMEFRAME, e.g. 90 days]. Show average click rate, conversion rate, and revenue per recipient for each day. Identify our strongest and weakest send days and tell me if the pattern is consistent or varies by segment.`,
            category: Category.INSIGHTS,
          },
          {
            id: 'i15',
            title: 'New Subscriber Behavior Check',
            requiresData: true,
            content: `Analyze subscribers who joined our list in the last [TIMEFRAME, e.g. 30 days]. How many have clicked? How many have purchased? What's their conversion rate compared to our overall list? Identify whether our new subscribers are engaging at a healthy rate or dropping off early, and flag any acquisition source that's bringing in low-quality profiles.`,
            category: Category.INSIGHTS,
          },
          {
            id: 'i16',
            title: 'Promo vs. Non-Promo Performance Split',
            requiresData: true,
            content: `Split all campaigns from the last [TIMEFRAME, e.g. 90 days] into two groups: those with a discount/promo offer and those without. Compare click rate, conversion rate, AOV, and revenue per recipient between the two groups. Tell me whether our non-promotional content is holding its own or if we're overly dependent on discounts to drive engagement.`,
            category: Category.INSIGHTS,
          },
          {
            id: 'i17',
            title: 'Salvageable Audience Analysis',
            requiresData: true,
            content: `Analyze [BRAND]'s email list by engagement recency and purchase behavior over the last [TIMEFRAME] using the attached export. Split the audience into four states — active, dormant, at-risk, and churned — and state the boundary you used for each. Then answer the question that matters: of the profiles currently counted as active, how many are genuinely reachable and how many are inflating the number. Size each state, give its average previous order value, and name the salvage motion for each. Finish with the single segment where re-engagement effort returns the most, and why.`,
            category: Category.INSIGHTS,
          },

          // ── REPORTS & METRICS ──
          {
            id: 'r1',
            title: 'Underperformance Diagnosis',
            requiresData: true,
            content: `Analyze campaign [CAMPAIGN NAME] against our [TIMEFRAME, e.g. 90-day] performance averages. Lead with revenue per recipient, conversion rate, and click rate. Note open rate as a secondary reference only. Evaluate segment composition, timing, and content theme. Identify the most likely drivers behind the performance gap and determine whether it was a structural issue, a segment mismatch, or a one-off anomaly.`,
            category: Category.REPORTS,
          },
          {
            id: 'r2',
            title: 'Quarter-over-Quarter Trend Analysis',
            requiresData: true,
            content: `Compare email campaign performance from [CURRENT QUARTER] to [PREVIOUS QUARTER], focusing on revenue per recipient, click-to-open rate, conversion trends, and send cadence. Identify meaningful directional shifts — not small fluctuations — and explain the strategic implications for how we should plan next quarter.`,
            category: Category.REPORTS,
          },
          {
            id: 'r3',
            title: 'Engagement Momentum Scan',
            requiresData: true,
            content: `Review campaign performance over the last [TIMEFRAME, e.g. 120 days] and evaluate whether engagement metrics are trending upward, stabilizing, or declining. Focus on click behavior, conversion rate, and revenue efficiency across segments. Note open rate trends as directional only. Classify overall momentum as Strong, Stable, or At Risk — and explain what these signals suggest about our current lifecycle health.`,
            category: Category.REPORTS,
          },
          {
            id: 'r4',
            title: 'Seasonality & Behavior Signals',
            requiresData: true,
            content: `Evaluate campaign performance by send day and time over the last [TIMEFRAME, e.g. 90 days]. Benchmark engagement and revenue efficiency across weekday and time slots. Identify consistent high-efficiency windows and underperforming patterns. Determine whether timing is materially influencing results or if differences are primarily driven by content and audience.`,
            category: Category.REPORTS,
          },
          {
            id: 'r5',
            title: 'Monthly Performance Summary',
            requiresData: true,
            content: `Generate a comprehensive performance summary for [MONTH, YEAR]. Include total sends, average open rate, click-to-open rate, revenue per recipient, total email-attributed revenue, and unsubscribe rate. Compare each metric against the previous month and the [TIMEFRAME, e.g. 90-day] rolling average. Highlight the top [# OF CAMPAIGNS, e.g. 3] and bottom [# OF CAMPAIGNS, e.g. 3] performing campaigns with a brief explanation of what drove their results.`,
            category: Category.REPORTS,
          },
          {
            id: 'r6',
            title: 'Flow Performance Report',
            requiresData: true,
            content: `Audit the performance of all active email flows over the last [TIMEFRAME, e.g. 90 days]. For each flow, report on total recipients, click rate, conversion rate, and revenue per recipient. Compare current performance against the previous period and flag any flows showing meaningful decline. Rank flows by revenue efficiency and identify which ones need immediate attention.`,
            category: Category.REPORTS,
          },
          {
            id: 'r7',
            title: 'List Health & Growth Report',
            requiresData: true,
            content: `Analyze our email list over the last [TIMEFRAME, e.g. 90 days]. Report on total list size, growth rate, new subscriber sources, unsubscribe rate, spam complaint rate, and the percentage of engaged vs. unengaged profiles. Identify whether list quality is improving or deteriorating, and flag any segments where deliverability risk is increasing.`,
            category: Category.REPORTS,
          },
          {
            id: 'r8',
            title: 'Revenue Attribution Breakdown',
            requiresData: true,
            content: `Break down email-attributed revenue from the last [TIMEFRAME, e.g. 30 days] by source: campaigns vs. flows. Within each, identify the top [# OF ITEMS, e.g. 5] individual campaigns and top [# OF ITEMS, e.g. 5] flows by revenue contribution. Show what percentage of total email revenue each source represents and whether the balance between campaigns and flows has shifted compared to the previous period.`,
            category: Category.REPORTS,
          },
          {
            id: 'r9',
            title: 'Single Campaign Recap',
            requiresData: true,
            content: `Pull the results for campaign [CAMPAIGN NAME] and give me a quick performance recap: open rate, click rate, CTOR, conversion rate, revenue, revenue per recipient, and unsubscribe rate. Compare each metric against our [TIMEFRAME, e.g. 30-day] average and tell me in one sentence whether this was above, at, or below expectations.`,
            category: Category.REPORTS,
          },
          {
            id: 'r10',
            title: 'Weekly Send Summary',
            requiresData: true,
            content: `Summarize all campaigns sent in the last [TIMEFRAME, e.g. 7 days]. For each, list: name, send date, segment, click rate, revenue, and revenue per recipient. Rank them by revenue per recipient and give me a one-line takeaway on the week overall.`,
            category: Category.REPORTS,
          },
          {
            id: 'r11',
            title: 'Flow Quick Check',
            requiresData: true,
            content: `Pull current performance for [FLOW NAME, e.g. welcome series, abandoned cart, winback]. Show me click rate, conversion rate, and revenue per recipient for each step in the flow. Flag any step with a significant drop-off compared to the previous step and provide specific recommendations to address each drop-off.`,
            category: Category.REPORTS,
          },
          {
            id: 'r12',
            title: 'Deliverability Snapshot',
            requiresData: true,
            content: `Give me a quick deliverability health check based on the last [TIMEFRAME, e.g. 30 days]. Report on delivery rate trends, bounce rate, spam complaint rate, and unsubscribe rate. Use inbox placement signals and delivery rate as the primary indicators — open rate is unreliable as a deliverability proxy due to Apple Mail Privacy Protection. Flag anything that looks abnormal or trending in the wrong direction and tell me if immediate action is needed.`,
            category: Category.REPORTS,
          },
          {
            id: 'r13',
            title: 'Campaign vs. Campaign Comparison',
            requiresData: true,
            content: `Compare campaign [CAMPAIGN A] vs. campaign [CAMPAIGN B] side by side. Show click rate, CTOR, conversion rate, revenue, and revenue per recipient for each. Tell me which one won overall, and identify the most likely reasons for the difference — was it segment, timing, content, or offer?`,
            category: Category.REPORTS,
          },
          {
            id: 'r14',
            title: 'Revenue Goal Tracker',
            requiresData: true,
            content: `Our email revenue goal for [MONTH] is [$ AMOUNT]. Based on performance so far this month, show me where we stand: total email revenue to date, daily run rate, projected finish, and the gap remaining. Tell me if we're on track, ahead, or behind — and what it would take to close the gap if needed.`,
            category: Category.REPORTS,
          },
          {
            id: 'r15',
            title: 'Unsubscribe Spike Alert',
            requiresData: true,
            content: `Our last campaign [CAMPAIGN NAME] had a higher-than-usual unsubscribe rate. Pull the data and compare it against our [TIMEFRAME, e.g. 30-day] average. Break down unsubscribes by segment and identify whether the spike came from a specific audience, content issue, or frequency problem. Tell me if this is a one-off or part of a trend.`,
            category: Category.REPORTS,
          },
          {
            id: 'r16',
            title: 'Top & Bottom Performers This Month',
            requiresData: true,
            content: `Rank all campaigns sent in [MONTH] by revenue per recipient. Show me the top [# OF CAMPAIGNS, e.g. 3] and bottom [# OF CAMPAIGNS, e.g. 3] with their key metrics. For each, give me a one-sentence explanation of what likely drove the result.`,
            category: Category.REPORTS,
          },

          // ── STRATEGY & PLANNING ──
          {
            id: 's1',

                            <div className="max-w-4xl mx-auto mt-8 p-5 bg-white/10 backdrop-blur-md border border-white/20 rounded-xl shadow-lg">
                                <p className="text-base sm:text-lg text-indigo-50 leading-relaxed font-medium">
                                    <span className="font-bold text-white">&#9881;&#65039; Before you start:</span> Make sure the AI tool you're using has access to your client's ESP data. In <strong>Claude</strong> or <strong>ChatGPT</strong>, connect the Klaviyo app (or the relevant ESP integration). In <strong>Flaunt</strong>, your client's Klaviyo access is built in. In <strong>Omega</strong>, confirm the client's data connection is active in the platform. For clients on ESPs without a direct connector, attach the necessary campaign and performance data in CSV or PDF format before running any prompt. Prompts marked with a <span className="inline-flex items-center gap-1 text-xs font-bold px-1.5 py-0.5 rounded bg-purple-200/30 text-white border border-purple-300/40"><Database className="w-3 h-3" /> Data</span> badge require live data access.
                                </p>
                            </div>
                        </div>
                    </header>
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 -mt-12">
                        <div className="bg-white rounded-2xl shadow-xl border border-gray-200 p-6 sm:p-8">
                            <Filters searchTerm={searchTerm} onSearchChange={setSearchTerm} selectedCategory={selectedCategory} onCategoryChange={setSelectedCategory} />
                            {filteredPrompts.length > 0 ? (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {filteredPrompts.map((prompt) => <PromptCard key={prompt.id} prompt={prompt} onClick={setActivePrompt} />)}
                                </div>
                            ) : (
                                <div className="text-center py-20">
                                    <div className="inline-block p-4 rounded-full bg-gray-100 mb-4"><BookOpen className="w-8 h-8 text-gray-400" /></div>
                                    <h3 className="text-lg font-medium text-gray-900">No prompts found</h3>
                                    <p className="text-gray-500 mt-1">Try adjusting your search.</p>
                                    <button onClick={() => { setSearchTerm(''); setSelectedCategory('All'); }} className="mt-4 text-brand-600 font-medium hover:text-brand-500">Clear all filters</button>
                                </div>
                            )}
                        </div>
                    </main>
                    <footer className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-12 text-center text-gray-500 text-sm">
                        <p>&copy; {new Date().getFullYear()} PDM - Lifecycle Team. Internal Use Only. v2 — September 2026</p>
                    </footer>
                    <PromptModal prompt={activePrompt} onClose={() => setActivePrompt(null)} />
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
